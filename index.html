<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة مستر عمر الكيال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar app shell (RTL), chalkboard-green accent + chalk-yellow highlight, graphite neutrals */
:root{
 --bg:#f3f4f2;--surface:#ffffff;--surface2:#eceeeb;--line:#d9dcd7;--fg:#1d211f;--muted:#646b67;
 --accent:#2f5d50;--accent-fg:#ffffff;--chalk:#c9a227;--good:#2e7d4f;--warn:#b7791f;--bad:#b23a3a;
 --good-bg:#e3f1e8;--warn-bg:#f8eed9;--bad-bg:#f6e1e1;
 --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#141716;--surface:#1c201e;--surface2:#242927;--line:#323835;--fg:#e8ebe9;--muted:#99a19d;
 --accent:#6fae98;--accent-fg:#0f1513;--chalk:#e0bd4a;--good:#6cc58f;--warn:#e2ad55;--bad:#e27b7b;
 --good-bg:#1f3227;--warn-bg:#3a2f1a;--bad-bg:#3a2020;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#141716;--surface:#1c201e;--surface2:#242927;--line:#323835;--fg:#e8ebe9;--muted:#99a19d;
 --accent:#6fae98;--accent-fg:#0f1513;--chalk:#e0bd4a;--good:#6cc58f;--warn:#e2ad55;--bad:#e27b7b;
 --good-bg:#1f3227;--warn-bg:#3a2f1a;--bad-bg:#3a2020;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.5rem}h2{font-size:1.1rem}h3{font-size:.95rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--surface);border-inline-start:0;border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff;padding:3px}
.brand b{font-family:var(--display);display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.78rem}
.roles{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface2);border-radius:8px;padding:3px}
.roles button{border:0;background:none;padding:6px 0;border-radius:6px;font-size:.82rem}
.roles button.on{background:var(--surface);box-shadow:0 1px 2px #0002;font-weight:600}
nav{display:flex;flex-direction:column;gap:2px}
nav button{border:0;background:none;text-align:start;padding:9px 12px;border-radius:6px;color:var(--muted)}
nav button.on{background:var(--surface2);color:var(--fg);font-weight:600;box-shadow:inset -3px 0 0 var(--accent)}
.side-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px}
main{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1180px;width:100%;margin-inline:auto}
@media(min-width:900px){main{padding-inline:32px}}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end;margin-bottom:20px}
.head p{margin:2px 0 0;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
select,input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi span{color:var(--muted);font-size:.82rem}
.kpi b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:.78rem;color:var(--good)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel>h2{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:500;text-align:start;font-size:.8rem;border-bottom:1px solid var(--line);padding:8px}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:500}
.p-good{background:var(--good-bg);color:var(--good)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-n{background:var(--surface2);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.bars{display:flex;align-items:end;gap:8px;height:170px;padding-top:10px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:4px;font-size:.75rem;color:var(--muted)}
.bar i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0}
.bar.last i{background:var(--chalk)}
.barlbl{display:flex;gap:8px;font-size:.72rem;color:var(--muted)}.barlbl span{flex:1;text-align:center}
.list{display:flex;flex-direction:column}
.list .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list .row:last-child{border:0}
.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
.scan{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}
.cam{aspect-ratio:1;max-width:100%;background:#111;border-radius:8px;position:relative;overflow:hidden;display:grid;place-items:center;color:#9aa}
.cam::before{content:"";position:absolute;inset:18%;border:2px solid var(--chalk);border-radius:10px}
.cam::after{content:"";position:absolute;left:18%;right:18%;height:2px;background:var(--chalk);top:30%;animation:sweep 2.2s ease-in-out infinite alternate}
@keyframes sweep{to{top:68%}}
@media(prefers-reduced-motion:reduce){.cam::after{animation:none}}
.stu-card{display:flex;flex-direction:column;gap:12px}
.stu-top{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface2);border-radius:6px;padding:8px 10px}
.kv span{font-size:.75rem;color:var(--muted);display:block}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.notice{border-radius:6px;padding:10px 12px;font-size:.88rem}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:.9rem;z-index:20}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:.88rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.full{grid-column:1/-1}
.perm td:not(:first-child){text-align:center}
.qr{width:150px;height:150px;background:#fff;padding:8px;border-radius:6px}
.profile{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.gr{display:flex;align-items:center;gap:8px}.gr .track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}.gr .track i{display:block;height:100%;background:var(--accent)}
.mobtop{display:none}
.login{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
.lcard img{width:72px;height:72px;border-radius:50%;background:#fff;padding:4px;align-self:center}
.lcard h1{text-align:center}.lcard>p{text-align:center;margin:-8px 0 4px}
.lcard label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.lerr{color:var(--bad);margin:0;font-size:.85rem}
.logout{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:.8rem}
.net{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:6px 10px;font-size:.8rem;text-align:start}
.net i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}.net.off i{background:var(--warn)}.net.off{border-color:var(--warn)}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:8px;padding:10px 12px}
.tcard.on{outline:2px solid var(--accent)}.tcard.off{opacity:.65}.tcard.off>span:first-of-type{text-decoration:line-through}
.tcard small{color:var(--muted);font-size:.8rem}.tcard .chips{gap:4px;margin-top:4px}
.slot.priv,.tcard.priv{border-style:dashed;border-inline-start:3px solid var(--warn);background:var(--warn-bg)}
.list label.row{cursor:pointer}
.sbox{position:relative;display:inline-block}
.sugg{position:absolute;top:calc(100% + 4px);inset-inline:0;min-width:260px;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px #0003;max-height:300px;overflow:auto}
.sugg button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;text-align:start}
.sugg button:last-child{border:0}.sugg button:hover,.sugg button:focus-visible{background:var(--surface2)}
.slot .loc{color:var(--fg);opacity:.8}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:200px}
.day.today{border-color:var(--accent)}
.day h3{font-size:.88rem;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.slot{display:flex;flex-direction:column;align-items:flex-start;text-align:start;border:1px solid var(--line);border-inline-start:3px solid var(--accent);background:var(--surface2);border-radius:6px;padding:6px 8px;gap:0;line-height:1.4}
.slot.lang{border-inline-start-color:var(--chalk)}
.slot.on{outline:2px solid var(--accent);outline-offset:1px}
.slot b{font-size:.82rem}.slot span{font-size:.85rem;font-weight:600}.slot small{font-size:.74rem;color:var(--muted)}

tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.switch{display:flex;gap:8px;align-items:center}
@media(max-width:860px){
 .app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:column}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}.side-foot{margin:0}
 .grid2,.scan,.form{grid-template-columns:1fr}.profile{grid-template-columns:1fr;justify-items:start}
}
</style>

</head>

function drawQR(){const c=$("#qr");if(!c)return;const x=c.getContext("2d"),n=25,z=150/n;x.fillStyle="#fff";x.fillRect(0,0,150,150);x.fillStyle="#111";let seed=7;
for(let i=0;i<n;i++)for(let j=0;j<n;j++){seed=(seed*9301+49297)%233280;if(seed/233280>.55)x.fillRect(i*z,j*z,z,z)}
[[0,0],[n-7,0],[0,n-7]].forEach(([a,b])=>{x.fillStyle="#fff";x.fillRect(a*z,b*z,7*z,7*z);x.fillStyle="#111";x.fillRect(a*z,b*z,7*z,7*z);x.fillStyle="#fff";x.fillRect((a+1)*z,(b+1)*z,5*z,5*z);x.fillStyle="#111";x.fillRect((a+2)*z,(b+2)*z,3*z,3*z)})}

${s.parentBad?`<div class="notice" style="background:var(--bad-bg);color:var(--bad)"><b>رقم ولي الأمر غلط أو مش بيرد.</b> اسأل الطالب عن الرقم الصح وعدّله، أو اختار حل تاني.
<div class="actions" style="margin-top:8px"><input id="newParent" placeholder="الرقم الصح 01xxxxxxxxx" class="num" style="flex:1;min-width:160px"><button class="btn pri sm" data-act="fixp">حفظ الرقم</button><button class="btn sm" data-act="later2">يجيبه الحصة الجاية</button><button class="btn sm" data-act="flag">بلّغ المستر</button></div></div>`:""}
<div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface2);border-radius:6px;padding:8px 10px"><span>ولي الأمر: <b class="num">${s.parent}</b> ${vpill(s)}</span>${s.verified?"":`<button class="btn sm" data-act="verify">تم التأكد من الرقم</button>`}</div>
<div class="kv"><div><span>نظام الدفع</span>${s.plan==="شهر"?"شهري":"بالحصة"}</div><div><span>الحالة</span>${payPill(s)}</div><div><span>الحضور</span><b class="num">${s.att}/${s.total}</b></div></div>
${due?`<div class="notice" style="background:var(--bad-bg);color:var(--bad)">الشهر خلص (4 حصص). محتاج يدفع شهر جديد أو يدفع الحصة.</div>`:s.plan==="حصة"?`<div class="notice" style="background:var(--warn-bg);color:var(--warn)">بيدفع بالحصة · سعر الحصة ${sessPrice(s)} ج${s.custom?" (سعر خاص)":""}</div>`:""}
${s.diffDue?`<div class="notice" style="background:var(--warn-bg);color:var(--warn)">السعر اتغير: عليه فرق ${s.diffDue} ج عن الشهر اللي دافعه.</div>`:""}
<div class="actions"><button class="btn pri" data-act="att">تسجيل حضور</button>
${s.plan==="حصة"||due?`<button class="btn" data-act="sess">تأكيد استلام الحصة</button><button class="btn" data-act="month">تأكيد استلام الشهر</button><button class="btn" data-act="later">هيدفع الحصة الجاية</button>`:""}
${s.diffDue?`<button class="btn" data-act="diff">استلام الفرق ${s.diffDue} ج</button>${pricing.allowWaive?`<button class="btn" data-act="waive">إعفاء من الفرق</button>`:""}`:""}<button class="btn" data-act="skip">إلغاء</button></div></div>`;
r.dataset.id=s.id}

function nCalc(){let t=0;document.querySelectorAll("[id^=nb]:checked:not(:disabled)").forEach(x=>t+=+x.dataset.p);if($("#useP")?.checked)document.querySelectorAll("[id^=pp]:checked").forEach(x=>t-=+x.dataset.a);t=Math.max(0,t);const el=$("#nTot");if(el)el.textContent=t+" ج";return t}
function render(){if(view!=="stu")expelArm=false;$("#nav").innerHTML=NAV[role].map(([k,l])=>`<button data-v="${k}" class="${k===view?"on":""}">${l}</button>`).join("");$("#main").innerHTML=V[view]();drawQR();applySearch()}
function openStu(id){cur=students.find(x=>x.id===id);view="stu";q="";render();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button")||e.target.closest("tr[data-open],tr[data-asst]");if(!t)return;
if(t.dataset.role){role=t.dataset.role;view=NAV[role][0][0];document.querySelectorAll(".roles button").forEach(b=>b.classList.toggle("on",b===t));render()}
else if(t.dataset.asst){curA=assistants.find(a=>a.id===t.dataset.asst);am=0;view="asst";render();scrollTo(0,0)}
else if(t.dataset.tg){selT=selT===t.dataset.tg?null:t.dataset.tg;render()}
else if(t.dataset.npick){$("#ns").hidden=true;$("#ncode").value="";cur=students.find(x=>x.id===t.dataset.npick);$("#nres").innerHTML=V.notesCard(cur);nCalc()}
else if(t.dataset.ppay){const [pid,sid]=t.dataset.ppay.split("|"),p=PRIV.find(x=>x.id===pid);p.paid[sid]=true;toast(`اتستلم ${p.price} ج للحصة التعويضية`);if(view==="scan")showStudent(sid);else render()}
else if(t.dataset.padd){const p=PRIV.find(x=>x.id===t.dataset.padd),v=$("#padd_"+p.id).value;if(!v){toast("اختار الطالب الأول");return}p.students.push(v);render();toast("الطالب اتضاف للحصة")}
else if(t.id==="expel"){if(!expelArm){expelArm=true;render();return}cur.expelled=true;expelArm=false;render();toast(`${cur.name} اتطرد ومش هيقدر يتسجله حضور`)}
else if(t.id==="pAll"){document.querySelectorAll("[id^=pp]").forEach(x=>x.checked=true);nCalc()}
else if(t.id==="nPay"){const sel=[...document.querySelectorAll("[id^=nb]:checked:not(:disabled)")];if(!sel.length){toast("اختار مذكرة واحدة على الأقل");return}const tot=nCalc();sel.forEach(x=>cur.notes.push(x.dataset.t));if($("#useP")?.checked){const used=[...document.querySelectorAll("[id^=pp]:checked")].map(x=>+x.id.slice(2));cur.paperPaid=cur.paperPaid.filter((_,i)=>!used.includes(i))}notesIncome+=tot;$("#nres").innerHTML=V.notesCard(cur);nCalc();toast(`اتستلم ${tot} ج مذكرات`)}
else if(t.dataset.pick){$("#cs").hidden=true;$("#code").value="";showStudent(t.dataset.pick)}
else if(t.dataset.g){selG=selG===t.dataset.g?null:t.dataset.g;render();if(selG)document.querySelector(".tbl h2")?.scrollIntoView({behavior:"smooth",block:"center"})}
else if(t.dataset.v){view=t.dataset.v;render()}
else if(t.dataset.open){openStu(t.dataset.open)}
else if(t.dataset.act){const s=students.find(x=>x.id===$("#result").dataset.id),a=t.dataset.act;
if(a==="att"){if(s._in){toast("الطالب ده اتسجل حضوره قبل كده");return}s._in=1;s.att++;$("#cnt").textContent=+$("#cnt").textContent+1;if(s.plan==="شهر"&&s.left>0)s.left--;saved(`اتسجل حضور ${s.name}`)}
if(a==="sess")toast(`اتأكد استلام ${sessPrice(s)} ج للحصة`);
if(a==="month"){s.plan="شهر";s.left=4;toast("اتأكد استلام الشهر · 4 حصص")}
if(a==="later"){s.paidNext=true;toast("اتبعت تنبيه للطالب في صفحته")}
if(a==="fixp"){const v=$("#newParent").value.trim();if(!/^01\d{9}$/.test(v)){toast("الرقم لازم يبقى 11 رقم ويبدأ بـ 01");return}s.parent=v;s.parentBad=false;s.verified=false;toast("الرقم اتعدل · محتاج يتأكد منه")}
if(a==="later2"){toast("اتسجل تذكير للطالب يجيب الرقم الصح")}
if(a==="flag"){toast("اتبعت تنبيه للمستر عن رقم ولي الأمر")}
if(a==="paper"){const g=GROUPS.find(x=>x.id===curG);s._paper=1;s.paperPaid.push({d:"2 نوفمبر",amt:g.paper.amt});toast(`اتستلم ${g.paper.amt} ج ورق`)}
if(a==="verify"){s.verified=true;toast("رقم ولي الأمر اتأكد")}
if(a==="diff"){toast(`اتستلم فرق ${s.diffDue} ج`);s.diffDue=0}
if(a==="waive"){s.diffDue=0;toast("الطالب اتعفى من الفرق (بإذن المستر)")}
if(a==="skip"){$("#result").innerHTML='<p class="muted">جاهز للطالب اللي بعده.</p>';return}
showStudent(s.id)}
else if(t.id==="net"){online=!online;if(online&&pending){toast(`النت رجع · اترفع ${pending} عملية`);pending=0}else if(!online)toast("وضع بدون نت: السكان والتسجيل شغالين عادي");upd()}
else if(t.id==="theme"){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark";t.textContent=dark?"الوضع الداكن":"الوضع الفاتح"}
else if(t.id==="out"){t.disabled=true;t.textContent="اتسجل الانصراف 6:12 م";toast("اتسجل انصرافك")}});
document.addEventListener("input",e=>{const id=e.target.id,v=e.target.value.trim();
if(id==="q"){q=e.target.value;applySearch();const box=$("#qs");if(!isAdmin()||!v){box.hidden=true;return}box.innerHTML=suggHTML(students.filter(s=>s.name.includes(v)||s.id.toLowerCase().includes(v.toLowerCase())||s.parent.includes(v)),"data-open");box.hidden=false}
if(id==="code"){const box=$("#cs");if(!v){box.hidden=true;return}box.innerHTML=suggHTML(students.filter(s=>s.group===curG&&(s.name.includes(v)||s.id.toLowerCase().includes(v.toLowerCase()))),"data-pick");box.hidden=false}
if(id==="ncode"){const box=$("#ns");if(!v){box.hidden=true;return}box.innerHTML=suggHTML(students.filter(s=>s.name.includes(v)||s.id.toLowerCase().includes(v.toLowerCase())||s.phone.includes(v)||s.parent.includes(v)),"data-npick");box.hidden=false}
if(id.startsWith("px")){PM[e.target.dataset.c][e.target.dataset.gr]=+e.target.value}});
document.addEventListener("click",e=>{if(!e.target.closest(".sbox"))document.querySelectorAll(".sugg").forEach(x=>x.hidden=true)});
document.addEventListener("change",e=>{if(e.target.id==="am"){am=+e.target.value;render()}if(e.target.id==="pvG"){pvGrade=e.target.value;render()}if(e.target.id==="useP"){$("#pBox").hidden=!e.target.checked;nCalc()}if(/^(nb|pp)/.test(e.target.id||""))nCalc();if(e.target.id==="curG"){curG=e.target.value;render()}if(e.target.id?.startsWith("px"))toast("اتحفظ السعر");if(e.target.id==="fg"){filt.g=e.target.value;render()}if(e.target.id==="fs"){filt.s=e.target.value;render()}if(e.target.id?.startsWith("pm"))toast("اتحفظت الصلاحية")});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.id;
if(f==="customForm"){cur.custom=$("#cOn").checked?+$("#cVal").value:null;render();toast(cur.custom?`سعر الحصة لـ ${cur.name} بقى ${cur.custom} ج`:"رجع لسعر السنتر")}
if(f==="priceForm"){const ns=+$("#pS").value,nm=+$("#pM").value,d=nm-pricing.month;pricing.allowWaive=$("#pA").checked;if(ns!==pricing.session||nm!==pricing.month){pricing.history.unshift({d:"2 نوفمبر",s:ns,m:nm,why:$("#pW").value||"تعديل سعر"});if(d>0)students.forEach(x=>{if(x.plan==="شهر"&&x.left>0&&!x.custom)x.diffDue=Math.round(d*x.left/4)});pricing.session=ns;pricing.month=nm;toast(d>0?"السعر اتغير · اتحسب الفرق للي دافعين شهر":"السعر اتغير")}else toast("اتحفظ");render()}
if(f==="moveForm"){const g=GROUPS.find(x=>x.id===selG),sl=g.slots[+$("#mvSlot").value],[h,m]=$("#mvTime").value.split(":").map(Number);sl.d=+$("#mvDay").value;sl.t=h+m/60;sl.moved=true;g.center=$("#mvCenter").value;render();toast(`الميعاد اتغير لـ ${DAYS[sl.d]} ${fmt(sl.t)} · اتبعت إشعار للطلبة`)}
if(f==="gpForm"){const g=GROUPS.find(x=>x.id===selG),a=$("#gpFix").value,b=$("#gpToday").value;g.price=a?+a:null;g.today=b?+b:null;render();toast(g.today!=null?`سعر النهارده بس ${g.today} ج`:"اتحفظ السعر")}
if(f==="expForm"){expenses.unshift({t:$("#exT").value,amt:+$("#exA").value,by:role==="teacher"?"المستر":aName(ME[role]),d:"النهارده"});render();toast("المصروف اتسجل")}
if(f==="ledForm"){const a=curA||assistants.find(x=>x.id===ME[role]),tp=$("#lT").value;a.ledger.push({mi:am,type:tp,amt:+$("#lA").value,d:"2 نوفمبر",days:$("#lD").value,why:$("#lW").value});render();toast(tp==="pay"?"اتسجل إنه استلم فلوسه":"الخصم اتسجل والأسستانت هيشوف السبب")}
if(f==="todayForm"){const g=GROUPS.find(x=>x.id===selT),p=$("#tP").value,w=$("#tW").value;g.today=p?+p:null;g.todayCenter=$("#tC").value!==g.center?$("#tC").value:null;g.delay=+$("#tD").value;g.cancel=$("#tX").checked;g.paper=w?{amt:+w,mode:$("#tM").value}:null;render();toast(g.cancel?"الحصة اتلغت واتبعت إشعار للطلبة":"اتحفظ واتبعت إشعار للطلبة")}
if(f==="privForm"){const st=[...document.querySelectorAll(".pvS:checked")].map(x=>x.value);if(!st.length){toast("اختار طالب واحد على الأقل");return}const [h,m]=$("#pvT").value.split(":").map(Number);PRIV.push({id:"p"+(PRIV.length+1),grade:pvGrade,center:$("#pvC").value,day:+$("#pvD").value,t:h+m/60,price:+$("#pvP").value,count:+$("#pvN").value,students:st,paid:{},makeup:[...document.querySelectorAll(".pvM:checked")].map(x=>x.value),asst:$("#pvA").value,then:$("#pvThen").value||null});render();toast("الحصة اتحفظت وظهرت في الجدول")}
if(f==="codeForm"){const v=$("#code").value.trim(),m=students.find(x=>x.id.toLowerCase()===v.toLowerCase())||students.find(x=>x.group===curG&&x.name.includes(v));$("#cs").hidden=true;showStudent(m?m.id:v)}
if(f==="noteForm"){notesCatalog.push({t:$("#nt").value,g:$("#ng").value,p:+$("#np").value});render();toast("اتضافت المذكرة")}
if(f==="newForm"){const id="K"+(2401+students.length);students.push({id,name:$("#sn").value,grade:$("#sg").value,sec:$("#ss").value,plan:$("#spl").value.startsWith("شهر")?"شهر":"حصة",left:4,att:0,total:0,hw:0,exam:[0],notes:[]});toast(`اتسجل الطالب بكود ${id}`);e.target.reset()}});
if(matchMedia("(prefers-color-scheme:dark)").matches)$("#theme").textContent="الوضع الفاتح";
const ACC={omar:"teacher",manager:"manager",assistant:"assistant",student:"student"};
function enter(r){role=r;view=NAV[r][0][0];document.querySelectorAll(".roles button").forEach(b=>b.classList.toggle("on",b.dataset.role===r));$("#login").hidden=true;$("#app").hidden=false;render()}
document.getElementById("loginForm").addEventListener("submit",e=>{e.preventDefault();e.stopPropagation();const u=$("#lu").value.trim().toLowerCase(),r=ACC[u];if(!r||$("#lp").value!=="1234"){$("#lerr").hidden=false;return}try{sessionStorage.setItem("kr",r)}catch(_){}enter(r)});
document.getElementById("logout").addEventListener("click",e=>{e.stopPropagation();try{sessionStorage.removeItem("kr")}catch(_){}$("#app").hidden=true;$("#login").hidden=false;$("#lp").value=""});
document.documentElement.dir="rtl";document.documentElement.lang="ar";try{const r=sessionStorage.getItem("kr");if(r&&NAV[r])enter(r)}catch(_){}
</script>

</body>
</html>
